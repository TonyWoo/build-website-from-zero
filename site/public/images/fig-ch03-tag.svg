<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350">
<rect width="100%" height="100%" rx="16" fill="#F7FAFF"/>

<!-- 上方标注：属性 -->
<text x="253" y="80" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#16324F">属性</text>
<text x="253" y="104" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="13" fill="#64748B">给标签加的补充说明</text>
<line x1="253" y1="114" x2="253" y2="138" stroke="#F59E0B" stroke-width="2.5" fill="none"/>

<!-- 代码条 -->
<rect x="80" y="140" width="600" height="84" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
<text font-family="'Noto Sans SC',sans-serif" font-size="30" y="196"><tspan x="136" fill="#2563EB">&lt;p</tspan><tspan x="172" fill="#F59E0B"> class="intro"</tspan><tspan x="384" fill="#2563EB">&gt;</tspan><tspan x="402" fill="#16324F">你好，世界</tspan><tspan x="556" fill="#2563EB">&lt;/p&gt;</tspan></text>

<!-- 下方标注线 -->
<line x1="260" y1="224" x2="260" y2="256" stroke="#2563EB" stroke-width="2.5" fill="none"/>
<line x1="467" y1="224" x2="467" y2="256" stroke="#2563EB" stroke-width="2.5" fill="none"/>
<line x1="588" y1="224" x2="588" y2="256" stroke="#2563EB" stroke-width="2.5" fill="none"/>

<!-- 开始标签 -->
<text x="260" y="284" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#16324F">开始标签</text>
<text x="260" y="308" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="13" fill="#64748B">段落从这里开始</text>

<!-- 内容 -->
<text x="467" y="284" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#16324F">内容</text>
<text x="467" y="308" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="13" fill="#64748B">显示出来的文字</text>

<!-- 结束标签 -->
<text x="588" y="284" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#16324F">结束标签</text>
<text x="588" y="308" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="13" fill="#64748B">斜杠表示结束</text>
</svg>
