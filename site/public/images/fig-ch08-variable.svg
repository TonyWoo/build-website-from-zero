<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
</defs>
<rect width="100%" height="100%" rx="16" fill="#F7FAFF"/>
<g font-family="'Noto Sans SC',sans-serif">
<rect x="80" y="86" width="210" height="118" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
<rect x="105" y="70" width="76" height="32" rx="8" fill="#2563EB"/>
<text x="143" y="92" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">age</text>
<text x="185" y="153" font-size="17" font-weight="bold" fill="#16324F" text-anchor="middle">18</text>
<text x="185" y="238" font-size="15" fill="#16324F" text-anchor="middle">let age = 18</text>
<text x="375" y="124" font-size="13" fill="#64748B" text-anchor="middle">重新赋值</text>
<line x1="315" y1="145" x2="435" y2="145" stroke="#2563EB" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<rect x="460" y="86" width="210" height="118" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
<rect x="485" y="70" width="76" height="32" rx="8" fill="#2563EB"/>
<text x="523" y="92" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">age</text>
<text x="565" y="153" font-size="17" font-weight="bold" fill="#F59E0B" text-anchor="middle">19</text>
<text x="565" y="238" font-size="15" fill="#16324F" text-anchor="middle">age = 19 之后</text>
<text x="380" y="292" font-size="13" fill="#64748B" text-anchor="middle">const 的盒子贴了封条：内容不能换</text>
</g>
</svg>
