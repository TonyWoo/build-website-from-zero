<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小北的空间 · 个人主页</title>
  <style>
  :root { --main-color: #2f80ed; --text-color: #333333; --bg-color: #f7f9fc; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg-color); color: var(--text-color); line-height: 1.6; }
  header.site { display: flex; justify-content: space-between; align-items: center; padding: 0 24px; height: 60px; background: #1e293b; }
  .logo { color: #fff; font-size: 20px; font-weight: bold; animation: fadeIn 0.8s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .menu { display: flex; gap: 20px; }
  .menu a { color: #e2e8f0; text-decoration: none; }
  .menu a:hover { color: #fff; }
  main { max-width: 900px; margin: 0 auto; padding: 24px; }
  section { margin-bottom: 28px; }
  h2 { color: var(--main-color); font-size: 22px; }
  .photo-wall { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .photo-wall img { width: 100%; display: block; border-radius: 8px; transition: transform 0.3s ease; }
  .photo-wall img:hover { transform: scale(1.05); }
  .notes li::before { content: "📌 "; }
  .notes li:first-child { font-weight: bold; color: var(--main-color); }
  button { background: var(--main-color); color: #fff; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; transition: background-color 0.3s ease; }
  button:hover { background: #1c66cc; }
  input, textarea, select { font: inherit; padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 6px; }
  .to-top { position: fixed; right: 20px; bottom: 20px; background: var(--main-color); color: #fff; padding: 10px 14px; border-radius: 8px; text-decoration: none; }
  footer { text-align: center; color: #94a3b8; font-size: 14px; padding: 16px; }
  @media (max-width: 768px) { .photo-wall { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) {
    .photo-wall { grid-template-columns: 1fr; }
    header.site { flex-direction: column; height: auto; padding: 10px 12px; gap: 6px; }
    .menu { flex-wrap: wrap; justify-content: center; }
  }

  /* 试玩版补充：后面章节新板块的样式 */
  .done { text-decoration: line-through; color: #999; }
  #todo-list li, #todoList li { margin: 6px 0; }
  #todo-list button, #todoList button { padding: 3px 10px; margin-left: 8px; }
  .gb-item { border-top: 1px solid #e2e8f0; padding: 8px 0; }
  #auth-area { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  </style>
</head>
<body>

    <nav class="menu">

    <section id="notes">
      <h2>学习笔记</h2>
      <ul class="notes">
        <li><a href="#">HTML 入门：标签就是盒子</a>——10 月 5 日</li>
        <li><a href="#">我的第一张网页诞生记</a>——10 月 8 日</li>
        <li><a href="#">表单为什么点了发送没反应</a>——10 月 12 日</li>
      </ul>
    </section>
    <section id="todo">
      <h2>待办清单</h2>
      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="想做点什么？">
        <button type="submit">添加</button>
      </form>
      <ul id="todo-list"></ul>
    </section>
    <section id="contact">
      <h2>联系我</h2>
      <form>
        <p><label for="name">你的名字：</label>
           <input type="text" id="name" name="name" placeholder="比如：小明"></p>
        <p><label for="email">你的邮箱：</label>
           <input type="email" id="email" name="email" placeholder="name@example.com"></p>
        <p><label for="topic">想聊点啥：</label>
           <select id="topic" name="topic"><option>夸夸这个网站</option><option>提个建议</option><option>约一起拍照</option></select></p>
        <p><label for="message">留言内容：</label><br>
           <textarea id="message" name="message" rows="4" placeholder="想说的话写在这里"></textarea></p>
        <button type="submit">发送</button>
      </form>
    </section>
  </main>
  <footer>
    <p>© 2026 小北 · 一行一行手工打造</p>
  </footer>
  <a class="to-top" href="#">回到顶部</a>
  <script>
    // 第 10 章的待办清单：点文字划掉，点按钮删除
    const form = document.querySelector('#todo-form');
    const input = document.querySelector('#todo-input');
    const list = document.querySelector('#todo-list');

    form.addEventListener('submit', function (event) {
      event.preventDefault();              // 1. 拦住提交，别让页面刷新
      const text = input.value.trim();     // 2. 读输入，trim() 去掉首尾空格
      if (text === '') {
        return;                            // 3. 是空的就不加，直接结束
      }
      const li = document.createElement('li');  // 4. 新建一条待办
      li.textContent = text;
      li.addEventListener('click', function () {  // 5. 点文字：划掉或恢复
        li.classList.toggle('done');
      });
      const del = document.createElement('button');  // 6. 配一个删除按钮
      del.textContent = '删除';
      del.addEventListener('click', function (event) {
        event.stopPropagation();           //    这次点击到此为止，别再往外传
        li.remove();                       //    把整条删掉
      });
      li.appendChild(del);
      list.appendChild(li);                // 7. 挂到列表上，页面显示出来
      input.value = '';                    // 8. 清空输入框，方便输入下一条
    });
  </script>
</body>
</html>
