<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
<rect width="100%" height="100%" rx="16" fill="#F7FAFF"/>

<!-- 左侧：页面线框 -->
<rect x="40" y="36" width="350" height="362" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>

<!-- 页头 -->
<rect x="52" y="48" width="326" height="46" rx="6" fill="#EAF2FE"/>
<text x="68" y="77" font-family="'Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#16324F">小北的空间</text>
<rect x="288" y="65" width="20" height="6" rx="3" fill="#7FB2F0"/>
<rect x="314" y="65" width="20" height="6" rx="3" fill="#7FB2F0"/>
<rect x="340" y="65" width="20" height="6" rx="3" fill="#7FB2F0"/>

<!-- 主区 -->
<rect x="52" y="106" width="326" height="230" rx="6" fill="#FFFFFF" stroke="#7FB2F0" stroke-width="2.5"/>

<!-- section：关于我 -->
<rect x="64" y="118" width="302" height="42" rx="6" fill="#F7FAFF" stroke="#7FB2F0" stroke-width="2"/>
<text x="76" y="138" font-family="'Noto Sans SC',sans-serif" font-size="13" font-weight="bold" fill="#16324F">关于我</text>
<rect x="76" y="146" width="120" height="5" rx="2.5" fill="#7FB2F0"/>

<!-- section：照片墙 -->
<rect x="64" y="168" width="302" height="62" rx="6" fill="#F7FAFF" stroke="#7FB2F0" stroke-width="2"/>
<text x="76" y="188" font-family="'Noto Sans SC',sans-serif" font-size="13" font-weight="bold" fill="#16324F">照片墙</text>
<rect x="76" y="196" width="60" height="26" rx="3" fill="#EAF2FE" stroke="#7FB2F0" stroke-width="2"/>
<rect x="146" y="196" width="60" height="26" rx="3" fill="#EAF2FE" stroke="#7FB2F0" stroke-width="2"/>
<rect x="216" y="196" width="60" height="26" rx="3" fill="#EAF2FE" stroke="#7FB2F0" stroke-width="2"/>

<!-- section：学习笔记 -->
<rect x="64" y="238" width="302" height="40" rx="6" fill="#F7FAFF" stroke="#7FB2F0" stroke-width="2"/>
<text x="76" y="258" font-family="'Noto Sans SC',sans-serif" font-size="13" font-weight="bold" fill="#16324F">学习笔记</text>
<rect x="76" y="265" width="150" height="5" rx="2.5" fill="#7FB2F0"/>

<!-- section：联系表单 -->
<rect x="64" y="286" width="302" height="42" rx="6" fill="#F7FAFF" stroke="#7FB2F0" stroke-width="2"/>
<text x="76" y="312" font-family="'Noto Sans SC',sans-serif" font-size="13" font-weight="bold" fill="#16324F">联系表单</text>
<rect x="150" y="299" width="110" height="14" rx="3" fill="#FFFFFF" stroke="#7FB2F0" stroke-width="2"/>
<rect x="268" y="299" width="44" height="14" rx="3" fill="#2563EB"/>

<!-- 页脚 -->
<rect x="52" y="348" width="326" height="38" rx="6" fill="#EAF2FE"/>
<text x="215" y="372" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="13" fill="#64748B">© 小北的空间</text>

<!-- 标注连接线 -->
<line x1="390" y1="66" x2="462" y2="66" stroke="#2563EB" stroke-width="2.5" fill="none"/>
<line x1="378" y1="180" x2="462" y2="158" stroke="#2563EB" stroke-width="2.5" fill="none"/>
<line x1="366" y1="199" x2="462" y2="242" stroke="#2563EB" stroke-width="2.5" fill="none"/>
<line x1="390" y1="367" x2="462" y2="330" stroke="#2563EB" stroke-width="2.5" fill="none"/>

<!-- 右侧标注：header -->
<rect x="470" y="52" width="76" height="28" rx="7" fill="#2563EB"/>
<text x="508" y="71" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">header</text>
<text x="470" y="106" font-family="'Noto Sans SC',sans-serif" font-size="13" fill="#64748B">页头：站名和导航住在这里</text>

<!-- 右侧标注：main -->
<rect x="470" y="140" width="60" height="28" rx="7" fill="#2563EB"/>
<text x="500" y="159" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">main</text>
<text x="470" y="194" font-family="'Noto Sans SC',sans-serif" font-size="13" fill="#64748B">主区：主要内容都装在这里</text>

<!-- 右侧标注：section -->
<rect x="470" y="228" width="86" height="28" rx="7" fill="#2563EB"/>
<text x="513" y="247" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">section</text>
<text x="470" y="282" font-family="'Noto Sans SC',sans-serif" font-size="13" fill="#64748B">区块：一块内容一个区块</text>

<!-- 右侧标注：footer -->
<rect x="470" y="316" width="72" height="28" rx="7" fill="#2563EB"/>
<text x="506" y="335" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">footer</text>
<text x="470" y="370" font-family="'Noto Sans SC',sans-serif" font-size="13" fill="#64748B">页脚：版权和联系方式</text>
</svg>
