    <path d="M182,83 L197,83" stroke="#2563EB" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M362,83 L377,83" stroke="#2563EB" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
